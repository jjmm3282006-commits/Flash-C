<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flashcard Maker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #f0f4ff;
    --bg2: #ffffff;
    --bg3: #f8fafc;
    --text: #1e293b;
    --text2: #64748b;
    --text3: #94a3b8;
    --border: #e2e8f0;
    --accent: #6366f1;
    --accent2: #8b5cf6;
    --green: #10b981;
    --green2: #059669;
    --red: #ef4444;
    --red2: #dc2626;
    --shadow: 0 4px 24px rgba(99,102,241,0.08);
    --shadow-lg: 0 8px 40px rgba(99,102,241,0.12);
  }

  .dark {
    --bg: #0f172a;
    --bg2: #1e293b;
    --bg3: #334155;
    --text: #f1f5f9;
    --text2: #94a3b8;
    --text3: #64748b;
    --border: #334155;
    --shadow: 0 4px 24px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    -webkit-tap-highlight-color: transparent;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.3s;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    color: var(--text);
    transition: background 0.2s;
  }

  .back-btn:hover { background: var(--bg3); }

  h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .theme-btn {
    background: var(--bg3);
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }

  .theme-btn:hover { transform: scale(1.1); }
  .theme-btn:active { transform: scale(0.95); }

  /* Main */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Typography */
  .page-title {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
  }

  .page-subtitle {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 24px;
  }

  /* Cards & Containers */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
  }

  .card:hover { box-shadow: var(--shadow-lg); }

  /* Inputs */
  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    background: var(--bg3);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, background 0.3s;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"]::placeholder { color: var(--text3); }

  /* Buttons */
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }

  .btn-primary:hover { opacity: 0.9; }

  .btn-success {
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: white;
  }

  .btn-danger {
    background: linear-gradient(135deg, var(--red), var(--red2));
    color: white;
  }

  .btn-ghost {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { background: var(--border); }

  .btn-full { width: 100%; }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
  }

  /* Form Row */
  .form-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .form-row input { flex: 1; }

  .form-stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Deck Grid */
  .deck-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .deck-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
    position: relative;
    box-shadow: var(--shadow);
  }

  .deck-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }

  .deck-card:active { transform: scale(0.98); }

  .deck-emoji { font-size: 32px; margin-bottom: 8px; }
  .deck-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .deck-count { font-size: 13px; color: var(--text2); }

  .deck-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--red);
    color: white;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-size: 14px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .deck-card:hover .deck-delete { opacity: 1; }

  /* Flashcard List */
  .flashcard-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    transition: background 0.3s;
  }

  .flashcard-content { flex: 1; }

  .flashcard-front {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .flashcard-back {
    font-size: 14px;
    color: var(--text2);
  }

  .flashcard-delete {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
    flex-shrink: 0;
  }

  .flashcard-item:hover .flashcard-delete { opacity: 1; }
  .flashcard-delete:hover { color: var(--red); }

  /* Study Mode - 3D Flip Card */
  .study-card-container {
    perspective: 1000px;
    height: 300px;
    margin: 24px 0;
    cursor: pointer;
  }

  .study-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }

  .study-card-inner.flipped {
    transform: rotateY(180deg);
  }

  .study-card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
    box-shadow: var(--shadow-lg);
  }

  .study-card-front {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
  }

  .study-card-back {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    transform: rotateY(180deg);
  }

  .study-card-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .study-card-text {
    font-size: 24px;
    font-weight: 700;
    line-height: 1.4;
    word-break: break-word;
  }

  .study-hint {
    text-align: center;
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 16px;
  }

  /* Progress Bar */
  .progress-container {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .progress-bar {
    flex: 1;
    height: 8px;
    background: var(--bg3);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    white-space: nowrap;
  }

  /* Study Controls */
  .study-controls {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .study-controls .btn { flex: 1; }

  .study-result {
    text-align: center;
    padding: 40px 20px;
  }

  .study-result-emoji { font-size: 64px; margin-bottom: 16px; }
  .study-result-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .study-result-text { color: var(--text2); margin-bottom: 24px; }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text3);
  }

  .empty-state-emoji { font-size: 56px; margin-bottom: 12px; }
  .empty-state-text { font-size: 15px; }

  /* Section Label */
  .section-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text3);
    margin-bottom: 12px;
    margin-top: 24px;
  }

  /* Stats Row */
  .stats-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .stat-badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    background: var(--bg3);
    color: var(--text2);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .deck-grid { grid-template-columns: 1fr; }
    .study-card-text { font-size: 20px; }
    .study-card-container { height: 250px; }
    .page-title { font-size: 24px; }
  }

  /* iOS fix */
  @media screen and (max-width: 768px) {
    input[type="text"] { font-size: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <button class="back-btn" id="backBtn" style="display:none" onclick="goBack()">←</button>
    <h1>📇 Flashcard Maker</h1>
  </div>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
</header>

<main>
  <!-- DECKS VIEW -->
  <div class="view active" id="decksView">
    <h2 class="page-title">Your Decks</h2>
    <p class="page-subtitle">Create flashcard decks to study anything</p>

    <form class="form-row" onsubmit="createDeck(event)">
      <input type="text" id="newDeckName" placeholder="New deck name..." autocomplete="off">
      <button type="submit" class="btn btn-primary">Create</button>
    </form>

    <div id="decksList"></div>
  </div>

  <!-- CARDS VIEW -->
  <div class="view" id="cardsView">
    <h2 class="page-title" id="cardsDeckName"></h2>
    <p class="page-subtitle" id="cardsDeckCount"></p>

    <div class="card">
      <div style="font-weight:700; margin-bottom:12px; font-size:14px;">Add New Card</div>
      <form class="form-stack" onsubmit="addCard(event)">
        <input type="text" id="cardFront" placeholder="Front (question / term)..." autocomplete="off">
        <input type="text" id="cardBack" placeholder="Back (answer / definition)..." autocomplete="off">
        <button type="submit" class="btn btn-primary btn-full">+ Add Card</button>
      </form>
    </div>

    <div id="cardsList"></div>

    <div id="studySection" style="display:none">
      <button class="btn btn-success btn-full" style="padding:16px; font-size:17px; margin-top:8px;" onclick="startStudy()">
        🎯 Start Studying
      </button>
    </div>
  </div>

  <!-- STUDY VIEW -->
  <div class="view" id="studyView">
    <h2 class="page-title" id="studyDeckName"></h2>
    
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-text" id="progressText"></span>
    </div>

    <div id="studyCardArea">
      <div class="study-card-container" onclick="flipCard()">
        <div class="study-card-inner" id="studyCardInner">
          <div class="study-card-face study-card-front">
            <div class="study-card-label">Question</div>
            <div class="study-card-text" id="studyFront"></div>
          </div>
          <div class="study-card-face study-card-back">
            <div class="study-card-label">Answer</div>
            <div class="study-card-text" id="studyBack"></div>
          </div>
        </div>
      </div>

      <p class="study-hint" id="studyHint">Tap the card to reveal the answer</p>

      <div class="study-controls" id="studyRating" style="display:none">
        <button class="btn btn-danger" onclick="rateCard(false)">❌ Still Learning</button>
        <button class="btn btn-success" onclick="rateCard(true)">✅ Got It!</button>
      </div>

      <div class="study-controls">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevCard()">← Previous</button>
        <button class="btn btn-ghost" id="nextBtn" onclick="nextCard()">Next →</button>
      </div>
    </div>

    <div id="studyResult" style="display:none">
      <div class="study-result">
        <div class="study-result-emoji">🎉</div>
        <div class="study-result-title">Session Complete!</div>
        <div class="study-result-text" id="resultText"></div>
        <button class="btn btn-primary" onclick="restartStudy()">🔄 Study Again</button>
      </div>
    </div>
  </div>
</main>

<script>
  // State
  let decks = [];
  let currentDeckId = null;
  let studyIndex = 0;
  let studyFlipped = false;
  let knownCount = 0;
  let darkMode = false;

  // Init
  function init() {
    const saved = localStorage.getItem('flashcard-decks');
    if (saved) decks = JSON.parse(saved);
    
    const savedTheme = localStorage.getItem('flashcard-dark');
    if (savedTheme) {
      darkMode = JSON.parse(savedTheme);
      applyTheme();
    }

    renderDecks();
  }

  function save() {
    localStorage.setItem('flashcard-decks', JSON.stringify(decks));
  }

  // Theme
  function toggleTheme() {
    darkMode = !darkMode;
    localStorage.setItem('flashcard-dark', JSON.stringify(darkMode));
    applyTheme();
  }

  function applyTheme() {
    document.body.classList.toggle('dark', darkMode);
    document.getElementById('themeBtn').textContent = darkMode ? '☀️' : '🌙';
  }

  // Navigation
  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    
    const backBtn = document.getElementById('backBtn');
    backBtn.style.display = viewId === 'decksView' ? 'none' : 'block';
  }

  function goBack() {
    const studyView = document.getElementById('studyView');
    const cardsView = document.getElementById('cardsView');
    
    if (studyView.classList.contains('active')) {
      showView('cardsView');
      renderCards();
    } else if (cardsView.classList.contains('active')) {
      showView('decksView');
      currentDeckId = null;
      renderDecks();
    }
  }

  // Decks
  function createDeck(e) {
    e.preventDefault();
    const input = document.getElementById('newDeckName');
    const name = input.value.trim();
    if (!name) return;

    decks.push({
      id: Date.now().toString(),
      name: name,
      cards: []
    });
    save();
    input.value = '';
    renderDecks();
  }

  function deleteDeck(id, e) {
    e.stopPropagation();
    if (!confirm('Delete this deck and all its cards?')) return;
    decks = decks.filter(d => d.id !== id);
    save();
    renderDecks();
  }

  function openDeck(id) {
    currentDeckId = id;
    renderCards();
    showView('cardsView');
  }

  function renderDecks() {
    const container = document.getElementById('decksList');
    
    if (decks.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-emoji">📚</div>
          <div class="empty-state-text">No decks yet. Create your first one above!</div>
        </div>`;
      return;
    }

    const emojis = ['📖', '🧠', '📝', '🎓', '💡', '🔬', '🌍', '🎨', '🎵', '📐'];
    
    container.innerHTML = '<div class="deck-grid">' + decks.map((deck, i) => `
      <div class="deck-card" onclick="openDeck('${deck.id}')">
        <button class="deck-delete" onclick="deleteDeck('${deck.id}', event)" title="Delete deck">×</button>
        <div class="deck-emoji">${emojis[i % emojis.length]}</div>
        <div class="deck-name">${escapeHtml(deck.name)}</div>
        <div class="deck-count">${deck.cards.length} card${deck.cards.length !== 1 ? 's' : ''}</div>
      </div>
    `).join('') + '</div>';
  }

  // Cards
  function getCurrentDeck() {
    return decks.find(d => d.id === currentDeckId);
  }

  function addCard(e) {
    e.preventDefault();
    const front = document.getElementById('cardFront').value.trim();
    const back = document.getElementById('cardBack').value.trim();
    if (!front || !back) return;

    const deck = getCurrentDeck();
    deck.cards.push({
      id: Date.now().toString(),
      front: front,
      back: back
    });
    save();
    document.getElementById('cardFront').value = '';
    document.getElementById('cardBack').value = '';
    document.getElementById('cardFront').focus();
    renderCards();
  }

  function deleteCard(cardId) {
    if (!confirm('Delete this card?')) return;
    const deck = getCurrentDeck();
    deck.cards = deck.cards.filter(c => c.id !== cardId);
    save();
    renderCards();
  }

  function renderCards() {
    const deck = getCurrentDeck();
    if (!deck) return;

    document.getElementById('cardsDeckName').textContent = deck.name;
    document.getElementById('cardsDeckCount').textContent = 
      `${deck.cards.length} card${deck.cards.length !== 1 ? 's' : ''} in this deck`;

    const container = document.getElementById('cardsList');
    const studySection = document.getElementById('studySection');

    if (deck.cards.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-emoji">🃏</div>
          <div class="empty-state-text">No cards yet. Add your first card above!</div>
        </div>`;
      studySection.style.display = 'none';
      return;
    }

    container.innerHTML = '<div class="section-label">Cards</div>' + deck.cards.map(card => `
      <div class="flashcard-item">
        <div class="flashcard-content">
          <div class="flashcard-front">Q: ${escapeHtml(card.front)}</div>
          <div class="flashcard-back">A: ${escapeHtml(card.back)}</div>
        </div>
        <button class="flashcard-delete" onclick="deleteCard('${card.id}')" title="Delete card">🗑️</button>
      </div>
    `).join('');

    studySection.style.display = 'block';
    studySection.querySelector('button').textContent = 
      `🎯 Start Studying (${deck.cards.length} card${deck.cards.length !== 1 ? 's' : ''})`;
  }

  // Study Mode
  function startStudy() {
    const deck = getCurrentDeck();
    if (!deck || deck.cards.length === 0) return;

    // Shuffle cards
    deck.cards = shuffleArray([...deck.cards]);
    save();

    studyIndex = 0;
    studyFlipped = false;
    knownCount = 0;

    document.getElementById('studyDeckName').textContent = deck.name;
    document.getElementById('studyCardArea').style.display = 'block';
    document.getElementById('studyResult').style.display = 'none';

    renderStudyCard();
    showView('studyView');
  }

  function renderStudyCard() {
    const deck = getCurrentDeck();
    const card = deck.cards[studyIndex];
    
    document.getElementById('studyFront').textContent = card.front;
    document.getElementById('studyBack').textContent = card.back;
    
    // Reset flip
    studyFlipped = false;
    document.getElementById('studyCardInner').classList.remove('flipped');
    document.getElementById('studyHint').textContent = 'Tap the card to reveal the answer';
    document.getElementById('studyRating').style.display = 'none';

    // Progress
    const progress = ((studyIndex + 1) / deck.cards.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    document.getElementById('progressText').textContent = `${studyIndex + 1} / ${deck.cards.length}`;

    // Nav buttons
    document.getElementById('prevBtn').disabled = studyIndex === 0;
    document.getElementById('nextBtn').disabled = studyIndex === deck.cards.length - 1;
  }

  function flipCard() {
    studyFlipped = !studyFlipped;
    document.getElementById('studyCardInner').classList.toggle('flipped', studyFlipped);
    
    if (studyFlipped) {
      document.getElementById('studyHint').textContent = 'How well did you know this?';
      document.getElementById('studyRating').style.display = 'flex';
    } else {
      document.getElementById('studyHint').textContent = 'Tap the card to reveal the answer';
      document.getElementById('studyRating').style.display = 'none';
    }
  }

  function rateCard(known) {
    if (known) knownCount++;
    nextCard();
  }

  function nextCard() {
    const deck = getCurrentDeck();
    if (studyIndex < deck.cards.length - 1) {
      studyIndex++;
      renderStudyCard();
    } else {
      showResult();
    }
  }

  function prevCard() {
    if (studyIndex > 0) {
      studyIndex--;
      renderStudyCard();
    }
  }

  function showResult() {
    const deck = getCurrentDeck();
    document.getElementById('studyCardArea').style.display = 'none';
    document.getElementById('studyResult').style.display = 'block';
    document.getElementById('resultText').textContent = 
      `You knew ${knownCount} out of ${deck.cards.length} cards`;
    
    // Update progress to 100%
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('progressText').textContent = `${deck.cards.length} / ${deck.cards.length}`;
  }

  function restartStudy() {
    startStudy();
  }

  // Utilities
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // Start
  init();
</script>

</body>
</html>
