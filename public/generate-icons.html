<!DOCTYPE html>
<html>
<head>
  <title>Generate PWA Icons</title>
</head>
<body>
  <h1>Flashcard Maker - PWA Icon Generator</h1>
  <p>Click the buttons below to download the app icons:</p>
  <button onclick="generateIcon(192)">Download 192x192 Icon</button>
  <button onclick="generateIcon(512)">Download 512x512 Icon</button>
  
  <script>
    function generateIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = '#4299e1';
      ctx.fillRect(0, 0, size, size);
      
      // Card shape
      const scale = size / 512;
      ctx.save();
      ctx.translate(size / 2, size / 2);
      
      // Back card
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.beginPath();
      ctx.roundRect(-120 * scale, -80 * scale, 200 * scale, 140 * scale, 12 * scale);
      ctx.fill();
      
      // Front card
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.roundRect(-80 * scale, -100 * scale, 200 * scale, 140 * scale, 12 * scale);
      ctx.fill();
      
      // Lines
      ctx.strokeStyle = '#4299e1';
      ctx.lineWidth = 8 * scale;
      ctx.lineCap = 'round';
      
      ctx.beginPath();
      ctx.moveTo(-50 * scale, -60 * scale);
      ctx.lineTo(90 * scale, -60 * scale);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(-50 * scale, -30 * scale);
      ctx.lineTo(70 * scale, -30 * scale);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(-50 * scale, 0);
      ctx.lineTo(50 * scale, 0);
      ctx.stroke();
      
      ctx.restore();
      
      // Download
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `icon-${size}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }
  </script>
</body>
</html>
